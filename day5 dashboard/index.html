        <section class="register">
            <h2>Registration Form</h2>
            <div class="form">
            <label>Name</label>
            <input type="text" placeholder="Enter your name">

            <label>Email</label>
            <input type="text" placeholder="Enter your email">

            <label>Date of Birth</label>
            <input type="date" placeholder="Enter your Birthday">

            <label>Phone Number</label>
            <input type="phone" placeholder="09xxxxxxxxx">

            <label>Gender</label>
            <div class="gen">
                <input type="radio" name="Gender" value="male" checked>
                <label>male</label>
                <input type="radio" name="Gender" value="female" checked>
                <label>female</label>
            </div>

            <label>Favorite Programming Language</label>
                    <div class="lan">
                        <label for="html">HTML</label>
                        <input type="checkbox" id="html" name="language" value="html">
                        <label for="css">CSS</label>
                        <input type="checkbox" id="css" name="language" value="css">
                        <label for="javascript">JavaScript</label>
                        <input type="checkbox" id="javascript" name="language" value="javascript">
                        <label for="react">React</label>
                        <input type="checkbox" id="react" name="language" value="react">
                    </div>
            
                    <label>Choose a color</label>
                    <select>
                        <option value="red">Red</option>
                        <option value="orange">orange</option>
                        <option value="purple">purple</option>                        
                    </select>

            <label>Message</label>
            <textarea id="message" placeholder="Enter your message"></textarea>

            <div class="submits">
            <button class="submit">Submit</button>
            <button class="reset">Reset</button>
         </div>
    </div>
